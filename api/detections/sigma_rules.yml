            - 'cmd.exe /c'
            - 'powershell -enc'
            - '/bin/sh -c'
            - 'wget http'
            - 'curl http'
    selection_webshell:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '/bash'
            - '/sh'
        ParentImage|contains:
            - 'w3wp.exe'
            - 'httpd'
            - 'nginx'
            - 'apache2'
            - 'tomcat'
    condition: selection_process or selection_webshell
falsepositives:
    - Legitimate administrative scripts executing via web server
    - Deployment automation tools
level: low
