# SENTINEL APEX -- Report Generator Manifest-Format Regression Gate
#
# Guards against a regression of the P0 fixed in generate_intel_reports.py
# where running with --manifest api/feed.json (a top-level JSON array)
# crashed with `AttributeError: 'list' object has no attribute 'get'`.
# That crash was swallowed by run_pipeline.py's allow_fail=True "ID format
# migration pass", so items in api/feed.json silently never received a
# report_url -- producing permanent 404s on /reports/<yyyy>/<mm>/<id>.html.
#
# Also guards against the F-02 report-registry dual-writer conflict
# (scripts/generate_dashboard_feeds.py racing scripts/build_reports_index.py
# on api/reports/index.json / stats.json) and the related
# scripts/r2_reports_integrity.py total_reports/latest.json-purge bugs --
# see tests/test_report_registry_single_writer.py.
#
# Also guards against scripts/safe_git_commit.py silently discarding
# freshly generated customer-facing intelligence (api/v1/intel/latest.json,
# apex.json, etc.) during git conflict recovery -- found during live
# post-deploy verification -- see
# tests/test_safe_git_commit_artifact_recovery.py.
#
# Also guards against a false positive in scripts/pre_deploy_gate.py's
# "index.html script tags balanced" check, which used to count the raw
# substring '<script' vs '</script>' and could fail on prose (e.g. a code
# comment) that merely mentions "<script>" -- found during live post-deploy
# verification of STAGE 5.4.5d -- see
# tests/test_pre_deploy_gate_script_balance.py.
#
# Also guards against scripts/build_reports_index.py showing the raw report
# ID as the title, "UNKNOWN" severity, and a null risk score for the large
# majority of the public REPORTS catalogue -- api/feed.json only holds the
# current run's rolling window (~40-55 items) but reports/ retains every
# report ever generated (11,000+), so most reports' enrichment lookup came
# back empty. Found during live production certification -- see
# tests/test_build_reports_index_artifact_fallback.py.
#
# Also guards against api/reports/index.json, api/reports/latest.json, and
# api/reports/stats.json (written by build_reports_index.py, Stage 3.3.7)
# being missing from safe_git_commit.py's staging list and its
# _GENERATED_ARTIFACT_PATHS conflict-recovery guard -- a concurrent-push
# merge conflict silently reverted them to a stale prior-origin/main
# snapshot with no warning, while every sibling artifact (api/feed.json,
# api/v1/intel/latest.json, etc.) was correctly detected and restored.
# Found live: production served total_reports=356/21/81 across the three
# files -- mutually inconsistent and none matching the pipeline run's
# actual 11,805-file disk scan -- see
# tests/test_safe_git_commit_artifact_recovery.py.
#
# Also guards against scripts/frontend_integrity.py's `verify()` treating a
# protected asset with no registry entry as a mere warning instead of a
# gate failure -- meaning a deleted registry entry silently disabled tamper
# detection for that file while GATE E still reported PASS. Found during a
# security-control hardening review of the new frontend-integrity-sync.yml
# workflow (PR #166) -- see tests/test_frontend_integrity_p0.py.
#
# Also guards against a recurrence of the monetization gate's false-positive
# mojibake detection, which hard-failed generate-and-sync.yml on every run
# from #544 (2026-09-02T07:23Z) through #550 (2026-09-03T13:05Z) -- ~30 hours.
# scripts/validate_monetization.py's check_no_junk_chars() hand-rolled a second
# mojibake pattern list whose entries were the plain, CORRECT UTF-8 encodings
# of ordinary punctuation (b"\xe2\x80\x94" is simply U+2014 EM DASH), so any
# page with a legitimate em dash failed the gate. Because STAGE 5.7 runs before
# the publication stages, AI Tracker generation succeeded every run while
# api/ai/tracker.json was never committed or R2-synced -- the platform's AI
# features went stale silently. Fixed in #353; these tests pin BOTH directions
# (correct punctuation is never flagged, genuine double-encoded corruption
# still is) -- see tests/test_monetization_mojibake_detection.py.
#
# Also guards against STAGE 3.3 (scripts/validate_reports.py, the Report
# Validation Gate) permanently hard-failing every scheduled sentinel-blogger.yml
# run since PR #369/#370 landed. Root cause: PR #369 bounded report
# (re)generation to a rolling REPORT_WINDOW_HOURS window to stop the
# whole-corpus R2 cost incident, but reports/ is gitignored and never
# persisted across CI runs -- so on every fresh runner, any advisory outside
# that window has no local file, and this gate previously required EVERY
# manifest entry (including thousands of historical ones) to have one.
# Confirmed live in runs #2244/#2245: ~1,394 false-positive RULE 3 failures,
# 100% outside the window. Fixed by deferring (not failing) advisories that
# are either outside the rolling window or confirmed durably published via
# scripts/r2_report_publisher.py's own state -- an in-window genuinely
# missing report still hard-fails exactly as before -- see
# tests/test_validate_reports_window_deferral.py.
#
# Also guards against STAGE 5.4.1 (scripts/report_existence_validator.py)
# hard-failing with the exact same architectural mismatch, one gate later --
# confirmed live in run #2249 (the first natural run after the STAGE 3.3 fix
# above unblocked it): this sibling validator was never updated with the
# same rolling-window/publish-state awareness, so it still required every
# data/stix/feed_manifest.json entry (including the full historical corpus)
# to have a local file, hard-failing and skipping GitHub Pages deployment
# for the rest of that run. Fixed with the identical deferral logic, reusing
# the same scripts/r2_report_publisher.py helpers -- see
# tests/test_report_existence_validator_window_deferral.py.
#
# Runs on every push and PR to main.

name: Report Generator Regression Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: report-generator-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-format-regression:
    name: "generate_intel_reports.py -- list & dict manifest formats"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: pip install pytest --quiet

      - name: Run manifest-format regression tests
        run: |
          python -m pytest tests/test_generate_intel_reports_manifest_formats.py -v --tb=short

      - name: Run report-registry single-writer regression tests (F-02)
        run: |
          python -m pytest tests/test_report_registry_single_writer.py -v --tb=short

      - name: Run cache-bust visibility regression test
        run: |
          python -m pytest tests/test_bust_kv_cache_visibility.py -v --tb=short

      - name: Run git-sync artifact-recovery regression tests
        run: |
          python -m pytest tests/test_safe_git_commit_artifact_recovery.py -v --tb=short

      - name: Run pre-deploy gate script-tag-balance regression tests
        run: |
          python -m pytest tests/test_pre_deploy_gate_script_balance.py -v --tb=short

      - name: Run reports-index artifact-fallback regression tests
        run: |
          python -m pytest tests/test_build_reports_index_artifact_fallback.py -v --tb=short

      - name: Run frontend integrity registry (GATE E) regression tests
        run: |
          python -m pytest tests/test_frontend_integrity_p0.py -v --tb=short

      - name: Run intelligence content contract regression tests (Phase 4)
        run: |
          python -m pytest tests/test_intelligence_content_contract.py -v --tb=short

      - name: Run --only-missing incremental repair regression tests (P0 report-continuity)
        run: |
          python -m pytest tests/test_generate_intel_reports_only_missing.py -v --tb=short

      - name: Run report materialization barrier regression tests (P0 report-continuity)
        run: |
          python -m pytest tests/test_report_materialization_barrier.py -v --tb=short

      - name: Run field-preserving-merge canonical-key regression tests (P0.2 report-continuity root cause)
        run: |
          python -m pytest tests/test_field_preserving_merge_canonical_key.py -v --tb=short

      - name: Run report-continuity barrier metrics observability tests (P0.2)
        run: |
          python -m pytest tests/test_report_continuity_barrier_metrics.py -v --tb=short

      - name: Run monetization-gate mojibake detection regression tests (P0 AI-publication stall)
        run: |
          python -m pytest tests/test_monetization_mojibake_detection.py -v --tb=short

      - name: Run Report Validation Gate rolling-window deferral regression tests (P0 report-validation stall)
        run: |
          python -m pytest tests/test_validate_reports_window_deferral.py -v --tb=short

      - name: Run Report Existence Validator rolling-window deferral regression tests (P0 STAGE 5.4.1 deploy-skip)
        run: |
          python -m pytest tests/test_report_existence_validator_window_deferral.py -v --tb=short
