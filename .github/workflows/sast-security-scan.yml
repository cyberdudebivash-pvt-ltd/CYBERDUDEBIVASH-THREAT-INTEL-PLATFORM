# ============================================================================
# CYBERDUDEBIVASH(R) SENTINEL APEX -- SAST Security Scan
# v47.4 -- v184.0 fix: Safety CLI replaced with pip-audit (typer crash fix)
#          safety==3.x crashes: AttributeError: module 'typer' has no attribute
#          'rich_utils'. pip-audit==2.7.3 is the stable, auth-wall-free successor.
# v47.3 -- Permanent P0 fix (Bandit format, JSONDecodeError, TruffleHog range,
#           Semgrep SARIF empty-runs API rejection + scan timeout)
#
# BUG FIXES (commit 6b898a4 regression):
#
#   FIX-1 (Bandit human-readable): --format text -> --format txt
#         'text' is not a valid bandit -f choice; valid: txt, json, csv, sarif, etc.
#
#   FIX-2 (JSONDecodeError cascade): replaced pipe-based JSON parsing with file+jq.
#         bash -o pipefail broke the pipe on bandit non-zero exit; python3 received
#         empty stdin -> JSONDecodeError line 1 col 1 (char 0).
#         Fix: bandit --output bandit-high.json (writes file, not stdout), validate
#         file exists + non-empty, parse with jq (pre-installed on ubuntu-latest).
#
#   FIX-3 (TruffleHog same-commit error): base: branch-name -> event.before SHA.
#         After push lands on main: git rev-parse main == HEAD == 6b898a4.
#         TruffleHog error: "BASE and HEAD commits are the same."
#         Fix: compute scan range per event type before running scan.
#           push:         base=github.event.before, head=github.sha
#           pull_request: base=PR base SHA, head=PR head SHA
#           schedule/dispatch: empty -> TruffleHog full-filesystem scan
#
#   FIX-4 (Semgrep "Invalid request. 1 item required; only 0 were supplied."):
#         Commit e4f691a introduced a fallback SARIF with "runs":[] (empty array).
#         GitHub Code Scanning API requires runs array to have >= 1 item.
#         Uploading "runs":[] produces exactly the observed API rejection error.
#         Root cause chain: scan timeout (5 rulesets on 800+ files > 20 min) ->
#         semgrep killed -> no SARIF written -> guard creates "runs":[] -> upload
#         rejected by GitHub API.
#         Fix A: Replace "runs":[] fallback with a structurally valid minimal SARIF
#                containing 1 run object with empty results array.
#         Fix B: Scope scan to agent/ + api/ (~425 files) to prevent timeout.
#                Bandit already scans agent/ only; Semgrep now matches that scope.
#         Fix C: Add --timeout 120 (per-rule timeout in seconds) to prevent any
#                single rule from hanging the runner indefinitely.
#         Fix D: Increase job timeout-minutes: 20 -> 30 as safety buffer.
# ============================================================================

#   v47.5 -- Private-repo Code Scanning compatibility layer.
#         ROOT CAUSE: GitHub Code Scanning (the API upload-sarif@v3 posts to)
#         requires GitHub Advanced Security on private repositories -- it's
#         free on public ones. This repo went private and GHAS is not
#         currently enabled, so both upload-sarif steps below started failing
#         with "Code scanning is not enabled for this repository", which in
#         turn failed the bandit/semgrep jobs outright and (as an unintended
#         side effect) skipped Bandit's real "Fail on HIGH severity findings"
#         step, since a job only runs its later steps if every prior step
#         succeeded.
#         FIX: continue-on-error on both upload-sarif steps. The real scanners
#         and Bandit's actual HIGH/HIGH fail-check are completely unaffected --
#         only whether results additionally get mirrored into the Security tab
#         is now allowed to fail without taking the job down with it. Each
#         upload step still genuinely attempts the upload every run, so if
#         GHAS is enabled later this starts succeeding again with zero further
#         code changes. Findings remain reviewable either way via the existing
#         (Bandit) / newly added (Semgrep) artifact upload.
name: SAST Security Scan -- Bandit + Safety + Semgrep

on:
  # EMERGENCY OPTIMIZATION (2026-07-29): path filters added to push/pull_request
  # only, ahead of the Aug 1 Actions quota reset. Evidence: of the last 58
  # commits to this repo, only 1 (1.7%) touched anything under these paths --
  # the other 57 were bot-generated data/report/feed commits that were
  # triggering a full SAST run for no reason (no path filter existed before
  # this change). Scoped to match what Bandit/Semgrep actually scan (agent/,
  # api/) restricted to real source (.py) so generated JSON/data commits
  # under api/ no longer trigger a scan. schedule and workflow_dispatch are
  # deliberately NOT path-filtered -- the daily full scan and manual runs are
  # unaffected and still scan everything. Concurrency (cancel-in-progress)
  # and branch restriction below were already correctly configured and are
  # unchanged. Rollback: remove the `paths:` blocks below.
  push:
    branches: [main, develop, "release/**"]
    paths:
      - "agent/**"
      - "api/**.py"
      - "requirements.txt"
      - ".github/workflows/sast-security-scan.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "agent/**"
      - "api/**.py"
      - "requirements.txt"
      - ".github/workflows/sast-security-scan.yml"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Run full deep scan (slower, more thorough)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.11"

jobs:

  # --------------------------------------------------------------------------
  # Bandit: Python AST-based SAST
  # --------------------------------------------------------------------------
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install "bandit[sarif]==1.7.8" "bandit-sarif-formatter==1.1.1"

      - name: Run Bandit (SARIF output)
        run: |
          bandit \
            --recursive agent/ \
            --format sarif \
            --output bandit-results.sarif \
            --severity-level medium \
            --confidence-level medium \
            --exclude agent/tests,agent/__pycache__ \
            --skip B101,B601,B324 \
            || true

      - name: Run Bandit (human-readable summary)
        run: |
          bandit \
            --recursive agent/ \
            --format txt \
            --severity-level high \
            --confidence-level high \
            --skip B101,B601,B324 \
            --exit-zero \
            --output bandit-summary.txt
          echo "Bandit summary (HIGH/HIGH):"
          cat bandit-summary.txt

      - name: Upload Bandit SARIF to GitHub Security
        id: upload-bandit-sarif
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # v47.5: don't fail the job if Code Scanning/GHAS is unavailable -- see header
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Note SARIF upload status
        if: always()
        run: |
          if [ "${{ steps.upload-bandit-sarif.outcome }}" = "success" ]; then
            echo "Bandit SARIF uploaded to the Security tab." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Bandit SARIF was not uploaded to the Security tab (Code Scanning/GHAS unavailable on this repository) -- findings remain in the bandit-report artifact below." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Bandit summary artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report-${{ github.run_id }}
          path: |
            bandit-results.sarif
            bandit-summary.txt
          retention-days: 30

      - name: Fail on HIGH severity + HIGH confidence findings
        run: |
          bandit \
            --recursive agent/ \
            --format json \
            --output bandit-high.json \
            --severity-level high \
            --confidence-level high \
            --skip B101,B601,B324 \
            --exit-zero

          if [ ! -f "bandit-high.json" ]; then
            echo "::error::bandit-high.json not generated"
            exit 1
          fi

          FILESIZE=$(wc -c < bandit-high.json)
          if [ "$FILESIZE" -lt 10 ]; then
            echo "::error::bandit-high.json too small (${FILESIZE} bytes)"
            exit 1
          fi

          COUNT=$(jq '.results | length' bandit-high.json)
          echo "HIGH/HIGH findings: $COUNT"

          if [ "$COUNT" -gt "0" ]; then
            jq -r '.results[] | "  [\(.issue_severity)/\(.issue_confidence)] \(.test_id) \(.test_name) @ \(.filename):\(.line_number)"' bandit-high.json >&2
            echo "::error::Bandit found $COUNT HIGH/HIGH issues. Review the Security tab."
            exit 1
          fi
          echo "Bandit: No HIGH/HIGH findings."

  # --------------------------------------------------------------------------
  # pip-audit: Python Dependency CVE Check (v184.0 — replaces broken Safety)
  # ROOT CAUSE: safety==3.x crashes with AttributeError: module 'typer' has no
  # attribute 'rich_utils' on current GitHub Actions runners. pip-audit is the
  # actively maintained, auth-wall-free, SARIF-native replacement.
  # --------------------------------------------------------------------------
  safety:
    name: Safety Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: pip install "pip-audit==2.7.3"

      - name: Run pip-audit dependency scan
        run: |
          # v184.4 FIX: the bare `|| true` here swallowed pip-audit's exit code
          # entirely, so a genuine tool failure (crash, network failure hitting
          # the OSV/PyPI advisory DB, malformed requirements.txt) looked
          # identical to "clean scan, no report needed" downstream. pip-audit's
          # own documented contract is 0=no vulns, 1=vulns found -- both are
          # legitimate completions and both write a report; anything else means
          # the scan itself never really ran. Persist the exit code so the parse
          # step can tell these apart.
          set +e
          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output pip-audit-report.json \
            --skip-editable
          echo $? > /tmp/pip_audit_exit_code
          set -e
          echo "pip-audit exit code: $(cat /tmp/pip_audit_exit_code)"
          echo "pip-audit scan complete"

      - name: Parse pip-audit results
        run: |
          PIP_AUDIT_EXIT=$(cat /tmp/pip_audit_exit_code 2>/dev/null || echo "0")
          if [ ! -f pip-audit-report.json ] || [ "$(wc -c < pip-audit-report.json)" -lt 5 ]; then
            if [ ! -f requirements.txt ]; then
              echo "pip-audit: no requirements.txt — nothing to scan"
              echo '{"dependencies":[]}' > pip-audit-report.json
              exit 0
            fi
            if [ "$PIP_AUDIT_EXIT" -gt 1 ]; then
              echo "::error::pip-audit failed (exit $PIP_AUDIT_EXIT) before producing a report, even though requirements.txt exists — the scan never actually completed. Treating as a failure, not a clean result."
              exit 1
            fi
            echo "pip-audit: report not generated — no vulnerabilities"
            echo '{"dependencies":[]}' > pip-audit-report.json
            exit 0
          fi

          # pip-audit JSON: {"dependencies": [{"name":..., "vulns": [...]}]}
          TOTAL=$(jq '[.dependencies[].vulns[]] | length' pip-audit-report.json 2>/dev/null || echo "0")
          echo "Total vulnerabilities: $TOTAL"

          if [ "$TOTAL" -eq "0" ]; then
            echo "pip-audit: No known vulnerabilities found."
            exit 0
          fi

          # Show summary for logs
          jq -r '.dependencies[] | select(.vulns | length > 0) | "\(.name)==\(.version): \([.vulns[].id] | join(", "))"' \
            pip-audit-report.json 2>/dev/null || true

          # CVE/PYSEC-identified subset, shown for log readability only.
          CRITICAL=$(jq '[.dependencies[].vulns[] | select(.id | test("CVE|PYSEC"))] | length' \
            pip-audit-report.json 2>/dev/null || echo "0")
          echo "CVE/PYSEC-linked vulnerabilities: $CRITICAL"

          # v184.4 FIX: the gate previously only failed on $CRITICAL, which is
          # filtered to IDs matching "CVE|PYSEC". pip-audit can report advisories
          # under GHSA identifiers alone (no CVE/PYSEC alias yet assigned) -- those
          # were silently excluded from $CRITICAL and would pass the gate even
          # though $TOTAL (checked above, only for the "zero vulnerabilities" exit)
          # already counted them. Gate on $TOTAL so every vulnerability pip-audit
          # actually found blocks the job, not just the CVE/PYSEC-identified ones.
          if [ "$TOTAL" -gt "0" ]; then
            # v184.3 FIX: this previously only logged a ::warning:: and always
            # exited 0 -- a job named "safety" (part of sast-gate's required
            # needs: list) reported success regardless of how many CVE-linked
            # dependency vulnerabilities were actually found.
            echo "::error::pip-audit found $TOTAL vulnerabilities ($CRITICAL CVE/PYSEC-linked). Review pip-audit-report.json and update requirements.txt."
            exit 1
          fi

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report-${{ github.run_id }}
          path: pip-audit-report.json
          retention-days: 30

  # --------------------------------------------------------------------------
  # Semgrep: Pattern-based SAST
  # --------------------------------------------------------------------------
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # v184.3 FIX: was `github.event_name != 'schedule' || ...` -- github.event.inputs
    # doesn't exist on schedule-triggered runs, so `.full_scan` was always empty/
    # undefined there, and the condition evaluated FALSE on every single cron run.
    # This directly contradicted the documented intent above ("schedule ... is
    # unaffected and still scan[s] everything") -- the daily full scan never
    # actually ran Semgrep. workflow_dispatch (default full_scan=false) keeps its
    # existing explicit-opt-in behavior; push/pull_request/schedule now all run it.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.full_scan == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # EMERGENCY OPTIMIZATION (2026-07-29): adds pip caching, matching the
      # pattern already used by the bandit/safety jobs above. Semgrep's own
      # scan config/rulesets/output are unchanged.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Run Semgrep (SARIF)
        run: |
          pip install semgrep --quiet
          semgrep scan \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/jwt \
            --config p/secrets \
            --config p/fastapi \
            --sarif \
            --output semgrep.sarif \
            --timeout 120 \
            agent/ api/ \
            || true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Ensure Semgrep SARIF is valid
        if: always()
        run: |
          SCHEMA="https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json"
          MINIMAL_SARIF='{"version":"2.1.0","$schema":"'"${SCHEMA}"'","runs":[{"tool":{"driver":{"name":"Semgrep","informationUri":"https://semgrep.dev","rules":[]}},"results":[]}]}'

          write_minimal() {
            echo "Writing valid minimal SARIF (1 run, 0 results)"
            printf '%s' "${MINIMAL_SARIF}" > semgrep.sarif
          }

          if [ ! -f semgrep.sarif ]; then
            echo "semgrep.sarif not found -- Semgrep produced no output file"
            write_minimal
          else
            BYTES=$(wc -c < semgrep.sarif)
            echo "semgrep.sarif present (${BYTES} bytes)"
            if ! jq empty semgrep.sarif 2>/dev/null; then
              echo "::warning::semgrep.sarif contains malformed JSON -- replacing"
              write_minimal
            else
              RUNS=$(jq '.runs | length' semgrep.sarif)
              echo "semgrep.sarif runs count: ${RUNS}"
              if [ "${RUNS}" -lt "1" ]; then
                echo "::warning::semgrep.sarif has empty runs[] -- GitHub API requires >= 1 -- replacing"
                write_minimal
              else
                echo "semgrep.sarif validated OK: ${RUNS} run(s)"
              fi
            fi
          fi

          echo "Final semgrep.sarif: $(wc -c < semgrep.sarif) bytes, runs=$(jq '.runs | length' semgrep.sarif)"

      - name: Upload Semgrep SARIF
        id: upload-semgrep-sarif
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true  # v47.5: don't fail the job if Code Scanning/GHAS is unavailable -- see header
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Note SARIF upload status
        if: always()
        run: |
          if [ "${{ steps.upload-semgrep-sarif.outcome }}" = "success" ]; then
            echo "Semgrep SARIF uploaded to the Security tab." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Semgrep SARIF was not uploaded to the Security tab (Code Scanning/GHAS unavailable on this repository) -- findings remain in the semgrep-report artifact below." >> "$GITHUB_STEP_SUMMARY"
          fi

      # v47.5: Semgrep had no artifact fallback at all (unlike Bandit, which
      # already uploads its SARIF+summary as an artifact) -- added so findings
      # stay reviewable even when the Security-tab upload above is unavailable.
      - name: Upload Semgrep summary artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report-${{ github.run_id }}
          path: semgrep.sarif
          retention-days: 30

  # --------------------------------------------------------------------------
  # TruffleHog: Secret Scanning
  # FIX-3: Compute proper diff range before running TruffleHog.
  # --------------------------------------------------------------------------
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Compute TruffleHog scan range
        id: scan-range
        run: |
          EVENT="${{ github.event_name }}"
          echo "Event: $EVENT"

          if [[ "$EVENT" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            ZERO="0000000000000000000000000000000000000000"

            if [[ -z "$BEFORE" || "$BEFORE" == "$ZERO" ]]; then
              echo "First push -- full-filesystem scan"
              echo "base=" >> "$GITHUB_OUTPUT"
              echo "head=" >> "$GITHUB_OUTPUT"
            else
              echo "Push diff: $BEFORE -> $HEAD_SHA"
              echo "base=${BEFORE}" >> "$GITHUB_OUTPUT"
              echo "head=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            fi

          elif [[ "$EVENT" == "pull_request" ]]; then
            PR_BASE="${{ github.event.pull_request.base.sha }}"
            PR_HEAD="${{ github.event.pull_request.head.sha }}"
            echo "PR diff: $PR_BASE -> $PR_HEAD"
            echo "base=${PR_BASE}" >> "$GITHUB_OUTPUT"
            echo "head=${PR_HEAD}" >> "$GITHUB_OUTPUT"

          else
            echo "Full scan (${EVENT})"
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "head=" >> "$GITHUB_OUTPUT"
          fi

      - name: TruffleHog OSS
        # v184.3 FIX: was pinned to the floating @main branch ref -- ironic for the
        # repo's own secret-scanning security gate to run unpinned/unverified code.
        # Pinned to the latest stable release tag, matching every other third-party
        # action in this workflow fleet (all use version tags, not floating refs).
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          path: ./
          base: ${{ steps.scan-range.outputs.base }}
          head: ${{ steps.scan-range.outputs.head }}
          extra_args: --only-verified

  # --------------------------------------------------------------------------
  # Summary Gate
  # --------------------------------------------------------------------------
  sast-gate:
    name: SAST Gate (required)
    # v184.3 NOTE: semgrep is deliberately NOT in this needs: list yet. Its scan
    # step (job `semgrep` above) still runs with `|| true` and has no fail-on-
    # findings check of its own -- unlike bandit/safety/trufflehog, semgrep here
    # runs 5 broad rulesets (p/python, p/owasp-top-ten, p/jwt, p/secrets,
    # p/fastapi) whose real false-positive rate against this specific codebase
    # has not been validated. This gate is used as a required check gating
    # every PR in this repo; wiring in an unvalidated hard-fail condition here
    # risks blocking the whole PR flow on noise rather than real findings.
    # Needs a one-time validation pass (run semgrep, review actual results,
    # then add a fail-on-error-level-findings check) before it can safely join
    # this required gate -- flagged rather than silently left unfixed.
    needs: [bandit, safety, trufflehog]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Check SAST results
        run: |
          BANDIT="${{ needs.bandit.result }}"
          SAFETY="${{ needs.safety.result }}"
          TRUFFLE="${{ needs.trufflehog.result }}"

          echo "Bandit:      $BANDIT"
          echo "Safety:      $SAFETY"
          echo "TruffleHog:  $TRUFFLE"

          if [[ "$BANDIT" == "failure" || "$SAFETY" == "failure" || "$TRUFFLE" == "failure" ]]; then
            echo "::error::One or more SAST scans failed."
            exit 1
          fi
          echo "All SAST scans passed."
