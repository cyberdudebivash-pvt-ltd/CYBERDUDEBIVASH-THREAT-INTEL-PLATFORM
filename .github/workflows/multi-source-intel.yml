# =============================================================================
# CYBERDUDEBIVASH(R) SENTINEL APEX v184.0 - MULTI-SOURCE INTELLIGENCE ENRICHMENT
# Version: v184.0 - P0 TIMESTAMP INTEGRITY FIX
# Race condition FIX: Cron unchanged - '45 1,5,9,13,17,21 * * *'
#                     (sentinel-blogger runs at 0,4,8,12,16,20 - no overlap)
#
# v184.0 CHANGES (P0 Intel Ingestion Fix):
#   - REPLACED broken ManifestMerger (class never existed) with true_intel_ingestor.py
#   - REPLACED broken SourceIntelligenceOrchestrator import (import path wrong)
#   - NOW commits feed_state.json + processed_intel.json for cross-run state persistence
#   - NOW commits feed_manifest.json (additive merge - safe with dedup engine)
#   - true_intel_ingestor.py enforces: published_at = SOURCE date, never NOW_UTC
#   - Per-source last_seen_timestamp prevents full re-scan on every run
# =============================================================================
name: CDB Multi-Source Intelligence Enrichment v142

on:
  schedule:
    - cron: '45 1,5,9,13,17,21 * * *'   # FIXED: no overlap with sentinel-blogger
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: sentinel-data-writer
  cancel-in-progress: false

jobs:
  multi-source-enrichment:
    name: Multi-Source Intelligence v142
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # PRODUCTION-VERIFICATION FIX (2026-09-02): this was hardcoded to
      # `ref: main`, which is a no-op for the schedule trigger (scheduled
      # runs always resolve github.ref to the default branch anyway) but
      # silently defeats workflow_dispatch's whole purpose of testing a
      # feature branch's changes before merge -- confirmed live: dispatching
      # this workflow from a feature branch runs THAT branch's workflow
      # YAML (new steps appear), but checks out main's file content
      # regardless, so a script only committed on the feature branch
      # ("python3: can't open file '.../scripts/intel_state_r2_sync.py'")
      # fails as if it were simply missing. github.ref already resolves to
      # the dispatching branch on workflow_dispatch and to the default
      # branch on schedule, so this is a strict improvement with no change
      # in scheduled behavior.
      - uses: actions/checkout@v6.0.2
        with: {fetch-depth: 1, ref: "${{ github.ref }}"}

      - uses: actions/setup-python@v5.5.0
        with: {python-version: '3.12', cache: 'pip'}

      - name: "Install Dependencies"
        run: pip install requests feedparser --quiet

      - name: "Prepare Directories"
        run: mkdir -p data/enrichment data/stix data/cache api

      # -----------------------------------------------------------------------
      # PULL INTEL INGESTION STATE FROM R2 (runtime-authority bridge)
      # See scripts/intel_state_r2_sync.py's own header for the full
      # architecture note. Confirmed live (2026-09-02): every run of this
      # workflow that finds new items has its "Commit Intel State &
      # Manifest" push below rejected by branch protection (GH013), so
      # feed_state.json/processed_intel.json/feed_manifest.json in this
      # checkout can be arbitrarily far behind whatever the last run
      # actually produced. R2 is now the authoritative copy going forward
      # (see the "Persist" step below) -- pull it before ingestion runs so
      # this run's incremental dedup/freshness tracking starts from the
      # real last-seen state, not from a stale git checkout. Non-fatal by
      # design: a missing R2 object (first run) falls through to this
      # checkout's own copy.
      # -----------------------------------------------------------------------
      - name: "Pull Intel Ingestion State from R2"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/intel_state_r2_sync.py --download || true

      - name: "Bootstrap Critical Files"
        env:
          CDB_JWT_SECRET: ${{ secrets.CDB_JWT_SECRET }}
        run: python3 scripts/bootstrap_critical_files.py

      # 
      # TRUE INCREMENTAL INGESTION (P0 FIX v184.0)
      # Replaces the broken ManifestMerger + SourceIntelligenceOrchestrator.
      # true_intel_ingestor.py:
      #   - Fetches CISA KEV, NVD CVE, GitHub Advisories, ransomware.live, URLhaus, RSS
      #   - Tracks per-source last_seen_timestamp in data/cache/feed_state.json
      #   - Only processes items WHERE source_published_at > last_seen_timestamp[source]
      #   - Deduplicates via SHA256(source_url + title + published_at) fingerprint
      #   - Writes ONLY new items to data/stix/feed_manifest.json (additive merge)
      #   - NEVER sets published_at = NOW_UTC - always preserves source date
      # 
      - name: "True Incremental Intel Ingestion"
        env:
          GITHUB_TOKEN_INTEL: ${{ secrets.GH_INTEL_TOKEN }}
          CDB_JWT_SECRET: ${{ secrets.CDB_JWT_SECRET }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 scripts/true_intel_ingestor.py
          echo "Ingestion exit code: $?"

      # 
      # VALIDATE OUTPUT - fail fast if something broke the manifest
      # 
      - name: "Validate Manifest Integrity"
        run: |
          python3 scripts/validate_manifest_integrity.py

      # -----------------------------------------------------------------------
      # PERSIST INTEL INGESTION STATE TO R2 (runtime-authority bridge)
      # This is now the AUTHORITATIVE persistence path for feed_state.json /
      # processed_intel.json / feed_manifest.json -- see
      # scripts/intel_state_r2_sync.py's header. Runs before the git commit
      # attempt below (kept for the append-only data/intelligence_repository/
      # registries and as a best-effort legacy path for the same 3 files) so
      # this run's ingested intelligence reaches R2 -- and therefore
      # sentinel-blogger.yml's own R2 bootstrap step and any Worker handler
      # that reads these keys directly -- regardless of whether the git push
      # below succeeds.
      # -----------------------------------------------------------------------
      - name: "Persist Intel Ingestion State to R2"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/intel_state_r2_sync.py --upload

      #
      # COMMIT STATE FILES - best-effort legacy path + append-only registries
      # feed_state.json / processed_intel.json / feed_manifest.json are now
      # authoritatively persisted to R2 above; this git commit is kept as a
      # best-effort secondary copy (useful for local dev checkouts) for
      # those 3, and remains the only persistence path for the
      # data/intelligence_repository/ registries below, which have no R2
      # consumer yet and are out of scope for this migration.
      #
      - name: "Commit Intel State & Manifest (best-effort)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "bivash@cyberdudebivash.com"
          git config --local user.name  "CYBERDUDEBIVASH"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"

          # Clean up any stale rebase/merge state
          git rebase --abort 2>/dev/null || true
          git merge --abort  2>/dev/null || true
          rm -rf .git/rebase-merge .git/rebase-apply 2>/dev/null || true

          # Stage state files that MUST persist between runs
          git add -f data/cache/feed_state.json    2>/dev/null || true  # per-source last_seen
          git add -f data/processed_intel.json     2>/dev/null || true  # dedup fingerprint store
          git add -f data/stix/feed_manifest.json  2>/dev/null || true  # intel manifest (additive)

          # v184.0 P0: Run Intelligence Persistence Engine after every ingest
          python3 scripts/intel_persistence_engine.py 2>/dev/null || true

          # Stage repository files (append-only, never lose intelligence)
          git add -f data/intelligence_repository/intelligence_index.json     2>/dev/null || true
          git add -f data/intelligence_repository/advisory_registry.json      2>/dev/null || true
          git add -f data/intelligence_repository/intel_retention_registry.json 2>/dev/null || true
          git add -f data/intelligence_repository/intel_lifecycle_registry.json  2>/dev/null || true
          git add -f data/intelligence_repository/historical_feed_registry.json  2>/dev/null || true
          git add -f data/intelligence_repository/advisories/                  2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No intel state changes to commit."; exit 0
          fi

          # Count new entries for commit message
          NEW_COUNT=$(python3 -c "
          import json
          try:
              d = json.loads(open('data/cache/feed_state.json').read())
              print(len(d.get('sources',{})))
          except: print('?')
          " 2>/dev/null || echo "?")

          git commit -m "Intel v184.0 incremental ingest | ${NEW_COUNT} sources tracked | $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"

          # Push with retry + rebase strategy
          PUSHED=0
          for i in 1 2 3 4; do
            git fetch origin main --quiet 2>/dev/null || true
            git rebase origin/main --quiet 2>/dev/null \
              || { git rebase --abort 2>/dev/null || true; \
                   git merge origin/main -X ours --no-edit --quiet || true; }
            if git push origin main; then echo "Push OK on attempt $i"; PUSHED=1; break; fi
            sleep $((i * 15))
          done

          # P0 FIX (2026-08-xx): a push that fails all 4 attempts used to fall
          # through to a bare [WARN] echo with no exit 1, so the step (and
          # job) reported SUCCESS while silently discarding this run's
          # entire ingestion output -- confirmed live: every run since main
          # started requiring PRs rejected all 4 attempts with "GH013:
          # ... Changes must be made through a pull request", yet the job
          # stayed green for ~7 days straight while feed_state.json/
          # processed_intel.json/feed_manifest.json never advanced past
          # their last successful commit. Made loud (hard-fail) so this was
          # visible instead of invisible.
          #
          # PRODUCTION-VERIFICATION FIX (2026-09-02): this push is EXPECTED
          # to keep failing under this repository's branch-protection
          # ruleset (git-push-to-protected-main is structurally incompatible
          # with it -- that is the whole reason for the R2 persistence step
          # above) for feed_state.json/processed_intel.json/
          # feed_manifest.json, which now have a working, authoritative R2
          # path regardless of this step's outcome. Failing the JOB here
          # would misreport a run that successfully ingested and persisted
          # real intelligence as broken. Downgraded to a warning so the
          # attempt (and the still-real gap for the
          # data/intelligence_repository/ registries, which this git commit
          # remains the only persistence path for) stays visible without
          # blocking the pipeline on an operation this architecture no
          # longer depends on.
          if [ "$PUSHED" -ne 1 ]; then
            echo "::warning::Commit Intel State & Manifest: push to main was rejected on all 4 attempts (expected under branch protection -- see https://github.com/${{ github.repository }}/rules?ref=refs%2Fheads%2Fmain). feed_state.json/processed_intel.json/feed_manifest.json are unaffected (persisted to R2 above); data/intelligence_repository/ registry updates from this run, if any, were NOT persisted anywhere."
          fi
