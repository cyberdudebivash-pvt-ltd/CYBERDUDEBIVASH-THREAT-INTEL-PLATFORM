# =============================================================================
# CYBERDUDEBIVASH(R) SENTINEL APEX v184.0 - MULTI-SOURCE INTELLIGENCE ENRICHMENT
# Version: v184.0 - P0 TIMESTAMP INTEGRITY FIX
# Race condition FIX: Cron unchanged - '45 1,5,9,13,17,21 * * *'
#                     (sentinel-blogger runs at 0,4,8,12,16,20 - no overlap)
#
# v184.0 CHANGES (P0 Intel Ingestion Fix):
#   - REPLACED broken ManifestMerger (class never existed) with true_intel_ingestor.py
#   - REPLACED broken SourceIntelligenceOrchestrator import (import path wrong)
#   - NOW commits feed_state.json + processed_intel.json for cross-run state persistence
#   - NOW commits feed_manifest.json (additive merge - safe with dedup engine)
#   - true_intel_ingestor.py enforces: published_at = SOURCE date, never NOW_UTC
#   - Per-source last_seen_timestamp prevents full re-scan on every run
# =============================================================================
name: CDB Multi-Source Intelligence Enrichment v142

on:
  schedule:
    - cron: '45 1,5,9,13,17,21 * * *'   # FIXED: no overlap with sentinel-blogger
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: sentinel-data-writer
  cancel-in-progress: false

jobs:
  multi-source-enrichment:
    name: Multi-Source Intelligence v142
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6.0.2
        with: {fetch-depth: 1, ref: main}

      - uses: actions/setup-python@v5.5.0
        with: {python-version: '3.12', cache: 'pip'}

      - name: "Install Dependencies"
        run: pip install requests feedparser --quiet

      - name: "Prepare Directories"
        run: mkdir -p data/enrichment data/stix data/cache api

      - name: "Bootstrap Critical Files"
        env:
          CDB_JWT_SECRET: ${{ secrets.CDB_JWT_SECRET }}
        run: python3 scripts/bootstrap_critical_files.py

      # -----------------------------------------------------------------------
      # P0 FIX: Download Intel State from R2 (runtime-authoritative)
      # feed_state.json / processed_intel.json / feed_manifest.json used to be
      # committed to main by this workflow's own push below -- but that push
      # has been rejected on every run since main started requiring PRs
      # (confirmed live via job logs: "GH013 ... Changes must be made through
      # a pull request", 4/4 attempts, every ~4h run for a week straight),
      # silently discarding every run's freshly-ingested state. Extends the
      # #274/#293 pattern (api/ai/*.json moved off git onto R2) to these three
      # files: R2 is now the cross-run-persistent authority, downloaded here
      # BEFORE ingestion runs and re-uploaded (STAGE below) after. This step
      # hard-fails on a genuine R2 read error (network/auth/outage) rather
      # than silently starting from empty state, which would risk discarding
      # real dedup history and reintroducing duplicates -- see
      # scripts/r2_state_sync.py's own docstring for the full bootstrap
      # contract (an object simply not existing yet in R2, e.g. this
      # workflow's very first run after this fix, is NOT an error: the
      # current git-checkout copy is used as a one-time bootstrap source).
      # -----------------------------------------------------------------------
      - name: "Download Intel State from R2"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/r2_state_sync.py --download

      #
      # TRUE INCREMENTAL INGESTION (P0 FIX v184.0)
      # Replaces the broken ManifestMerger + SourceIntelligenceOrchestrator.
      # true_intel_ingestor.py:
      #   - Fetches CISA KEV, NVD CVE, GitHub Advisories, ransomware.live, URLhaus, RSS
      #   - Tracks per-source last_seen_timestamp in data/cache/feed_state.json
      #   - Only processes items WHERE source_published_at > last_seen_timestamp[source]
      #   - Deduplicates via SHA256(source_url + title + published_at) fingerprint
      #   - Writes ONLY new items to data/stix/feed_manifest.json (additive merge)
      #   - NEVER sets published_at = NOW_UTC - always preserves source date
      # 
      - name: "True Incremental Intel Ingestion"
        env:
          GITHUB_TOKEN_INTEL: ${{ secrets.GH_INTEL_TOKEN }}
          CDB_JWT_SECRET: ${{ secrets.CDB_JWT_SECRET }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 scripts/true_intel_ingestor.py
          echo "Ingestion exit code: $?"

      # 
      # VALIDATE OUTPUT - fail fast if something broke the manifest
      # 
      - name: "Validate Manifest Integrity"
        run: |
          python3 scripts/validate_manifest_integrity.py

      # -----------------------------------------------------------------------
      # P0 FIX: Upload Intel State to R2 (runtime-authoritative)
      # Publishes this run's updated feed_state.json / processed_intel.json /
      # feed_manifest.json to R2 -- independent of whether the git commit
      # below succeeds. This is now the ONLY durable persistence path for
      # these three files; see the "Download Intel State from R2" step above
      # for the full rationale. Retries 4x (scripts/r2_state_sync.py) and
      # hard-fails the job on total exhaustion, matching the "Commit Intel
      # State & Manifest" step's own push-exhaustion behavior below.
      # -----------------------------------------------------------------------
      - name: "Upload Intel State to R2"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/r2_state_sync.py --upload

      #
      # COMMIT REMAINING STATE - append-only intelligence repository files.
      # feed_state.json / processed_intel.json / feed_manifest.json are no
      # longer staged here (P0 FIX): they are R2-authoritative now (see the
      # upload step above) and main's branch ruleset rejects this workflow's
      # direct push for them anyway (git history shows no successful commit
      # of these paths by this workflow since main started requiring PRs).
      # Leaving a failed git push running in parallel with a working R2
      # publish served no purpose.
      #
      - name: "Commit Intel State & Manifest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "bivash@cyberdudebivash.com"
          git config --local user.name  "CYBERDUDEBIVASH"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"

          # Clean up any stale rebase/merge state
          git rebase --abort 2>/dev/null || true
          git merge --abort  2>/dev/null || true
          rm -rf .git/rebase-merge .git/rebase-apply 2>/dev/null || true

          # v184.0 P0: Run Intelligence Persistence Engine after every ingest
          python3 scripts/intel_persistence_engine.py 2>/dev/null || true

          # Stage repository files (append-only, never lose intelligence)
          git add -f data/intelligence_repository/intelligence_index.json     2>/dev/null || true
          git add -f data/intelligence_repository/advisory_registry.json      2>/dev/null || true
          git add -f data/intelligence_repository/intel_retention_registry.json 2>/dev/null || true
          git add -f data/intelligence_repository/intel_lifecycle_registry.json  2>/dev/null || true
          git add -f data/intelligence_repository/historical_feed_registry.json  2>/dev/null || true
          git add -f data/intelligence_repository/advisories/                  2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No intel state changes to commit."; exit 0
          fi

          # Count new entries for commit message
          NEW_COUNT=$(python3 -c "
          import json
          try:
              d = json.loads(open('data/cache/feed_state.json').read())
              print(len(d.get('sources',{})))
          except: print('?')
          " 2>/dev/null || echo "?")

          git commit -m "Intel v184.0 incremental ingest | ${NEW_COUNT} sources tracked | $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"

          # Push with retry + rebase strategy
          PUSHED=0
          for i in 1 2 3 4; do
            git fetch origin main --quiet 2>/dev/null || true
            git rebase origin/main --quiet 2>/dev/null \
              || { git rebase --abort 2>/dev/null || true; \
                   git merge origin/main -X ours --no-edit --quiet || true; }
            if git push origin main; then echo "Push OK on attempt $i"; PUSHED=1; break; fi
            sleep $((i * 15))
          done

          # P0 FIX: a push that fails all 4 attempts used to fall through to a
          # bare [WARN] echo with no exit 1, so the step (and job) reported
          # SUCCESS while silently discarding this run's entire ingestion
          # output -- confirmed live: every run since main started requiring
          # PRs rejected all 4 attempts with "GH013: ... Changes must be made
          # through a pull request", yet the job stayed green for ~7 days
          # straight while feed_state.json/processed_intel.json/
          # feed_manifest.json never advanced past their last successful
          # commit. Hard-fail so this is visible instead of invisible.
          if [ "$PUSHED" -ne 1 ]; then
            echo "::error::Commit Intel State & Manifest: push to main was rejected on all 4 attempts. This run's data/intelligence_repository/* append-only registry updates were NOT persisted (feed_state.json/processed_intel.json/feed_manifest.json are unaffected -- they are R2-authoritative now, published by the earlier 'Upload Intel State to R2' step regardless of this push's outcome). Check https://github.com/${{ github.repository }}/rules?ref=refs%2Fheads%2Fmain for the branch rule rejecting this push."
            exit 1
          fi
