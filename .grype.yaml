# .grype.yaml  -  CYBERDUDEBIVASH(R) SENTINEL APEX
# Grype CVE scan policy for SBOM gate (sbom-generation.yml).
#
# POLICY: Fail on CRITICAL/HIGH CVEs that have an available fix.
# CVEs with fix-state "not-fixed" or "wont-fix" are accepted risks:
#   - No upstream patch exists; code changes cannot remediate them.
#   - They are tracked in the uploaded SBOM artifacts for audit purposes.
#   - Reviewed quarterly by the CISO role.
#
# v48.0 (2026-06-08): Initial policy. Accompanies:
#   - requirements.txt: cryptography>=43.0.3 (fixes CVE-2024-26130 CRITICAL)
#   - requirements.txt: aiohttp>=3.10.11 (fixes CVE-2024-27306 CRITICAL)
#   - Dockerfile: apt-get upgrade in runtime stage (fixes OS-level criticals)
#
# v184.7 (2026-08-21): requirements.txt bumped to clear 97 of 98 CVEs
# pip-audit was independently flagging (fastapi/starlette/uvicorn/
# python-multipart/python-dotenv/scikit-learn/transformers/torch/pyjwt/
# requests/python-jose/urllib3/protobuf) -- the image installs from the
# same requirements.txt, so this SBOM gate's CRITICAL findings in those
# same packages are expected to clear too. The one remaining pip-audit
# finding (ecdsa CVE-2024-23342, no upstream fix) is suppressed at the
# pip-audit layer (sast-security-scan.yml), not here.
#
# After patching above, any remaining criticals are unfixed upstream.
# This policy ensures the SBOM gate does not permanently fail on CVEs
# that have no remediation path.

ignore:
  # v184.4 FIX: fix-state/namespace/package were incorrectly nested under a
  # `vulnerability:` key (which Grype requires to be a CVE-id string, not a
  # map) -- this crashed Grype's own config parser before any scan could
  # even start ("invalid application config: 3 error(s) decoding"). The
  # SBOM Gate step's own hardening fix (see sbom-generation.yml) then
  # correctly treated that tool-level failure as a failure -- previously it
  # was silently swallowed and always reported "0 actionable critical
  # CVEs" regardless of whether the scan ran at all. Fields below are
  # Grype's actual top-level ignore-rule matchers, not children of
  # `vulnerability`.
  #
  # Suppress CVEs where no fix has been released by the upstream maintainer.
  # These cannot be resolved by updating dependencies.
  - fix-state: not-fixed
  - fix-state: wont-fix
  # torch CPU-only wheels (SBOM scan only  -  not deployed to production)
  # torch CVEs are typically infrastructure-level and not exploitable in this
  # context (no GPU runtime, no model serving endpoint, no untrusted input).
  - namespace: nvd
    package:
      name: torch
      type: python

# Output: emit table + JSON (JSON is captured by --file flag in workflow)
output:
  - table
