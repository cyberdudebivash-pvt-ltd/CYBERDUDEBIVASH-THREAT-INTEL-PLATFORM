<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component Reference: Container — SENTINEL APEX</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<!--
  SENTINEL APEX — Component Reference: Responsive Container (PR-4)
  ==================================================================
  Standalone, previewable reference markup for the container/width
  primitives in css/components.css (.sapx-container / -wide / -narrow).

  This file is NOT included or imported by any page automatically —
  this repo has no templating/include system, so every real page is
  a self-contained HTML document. Copy the fragment(s) below into a
  page and adjust content as needed.

  Requires, in this order:
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
-->
<style>
  /* Preview-only outline so container edges are visible. Not part of
     the component system — delete when copying into a real page. */
  .preview-box { background: var(--sapx-color-bg-surface-raised); border: 1px dashed var(--sapx-color-border-strong); border-radius: var(--sapx-radius-md); padding: var(--sapx-space-4); color: var(--sapx-color-text-secondary); font-family: var(--sapx-font-mono); font-size: var(--sapx-font-size-sm); }
  body { background: var(--sapx-color-bg-base); margin: 0; }
</style>
</head>
<body>

<!-- Default container — max-width: 1200px. The standard width for
     page sections (nav, footer, most content sections). -->
<div class="sapx-container">
  <div class="preview-box">.sapx-container — max-width: 1200px</div>
</div>

<br>

<!-- Wide container — max-width: 1440px. For sections that want extra
     breathing room (large stat grids, wide integration logos strip). -->
<div class="sapx-container-wide">
  <div class="preview-box">.sapx-container-wide — max-width: 1440px</div>
</div>

<br>

<!-- Narrow container — max-width: 800px. For prose-heavy or
     single-column content (long-form copy, centered CTA banners). -->
<div class="sapx-container-narrow">
  <div class="preview-box">.sapx-container-narrow — max-width: 800px</div>
</div>

</body>
</html>
