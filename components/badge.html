<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component Reference: Badge System — SENTINEL APEX</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<!--
  SENTINEL APEX — Component Reference: Badge System (PR-4)
  ==================================================================
  Standalone, previewable reference markup for every badge variant in
  css/components.css (.sapx-badge base + neutral / brand / success /
  warning / danger / info / severity-critical / -high / -medium / -low).

  Severity badges are for CONTENT/MARKETING pages (e.g. a blog post's
  CVE severity label) — a separate, independent system from
  css/card_renderer_styles.css's dashboard severity styling. Do not
  use these on dashboard threat cards.

  This file is NOT included or imported by any page automatically —
  copy the fragment(s) below into a page as needed.

  Requires, in this order:
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
-->
<style>
  body { background: var(--sapx-color-bg-base); margin: 0; }
  .demo-row { display: flex; gap: var(--sapx-space-3); flex-wrap: wrap; align-items: center; margin-bottom: var(--sapx-space-5); }
  .demo-label { font-family: var(--sapx-font-mono); font-size: var(--sapx-font-size-xs); color: var(--sapx-color-text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 var(--sapx-space-2); }
</style>
</head>
<body>
<section class="sapx-section">
  <div class="sapx-container">
    <p class="sapx-section-kicker">Component Reference</p>
    <h2 class="sapx-section-heading">Badge System</h2>

    <p class="demo-label">Neutral / Brand — status labels, tags</p>
    <div class="demo-row">
      <span class="sapx-badge sapx-badge-neutral">Beta</span>
      <span class="sapx-badge sapx-badge-brand">New</span>
    </div>

    <p class="demo-label">Semantic — success / warning / danger / info</p>
    <div class="demo-row">
      <span class="sapx-badge sapx-badge-success">Operational</span>
      <span class="sapx-badge sapx-badge-warning">Degraded</span>
      <span class="sapx-badge sapx-badge-danger">Outage</span>
      <span class="sapx-badge sapx-badge-info">Maintenance</span>
    </div>

    <p class="demo-label">Severity — content/marketing pages only (e.g. a blog post's CVE severity label)</p>
    <div class="demo-row">
      <span class="sapx-badge sapx-badge-severity-critical">Critical</span>
      <span class="sapx-badge sapx-badge-severity-high">High</span>
      <span class="sapx-badge sapx-badge-severity-medium">Medium</span>
      <span class="sapx-badge sapx-badge-severity-low">Low</span>
    </div>
  </div>
</section>
</body>
</html>
