<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component Reference: Call-to-Action Banner — SENTINEL APEX</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<!--
  SENTINEL APEX — Component Reference: Call-to-Action Banner (PR-4)
  ==================================================================
  Standalone, previewable reference markup for the generic
  .sapx-cta-banner from css/components.css — a centered heading/copy/
  actions block used to close out a page section with a conversion
  prompt. For the pricing-specific and newsletter-specific banner
  variants, see pricing-cta.html and newsletter.html respectively.

  This file is NOT included or imported by any page automatically —
  copy the fragment(s) below into a page and adjust copy/hrefs.

  Requires, in this order:
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
-->
<style>
  body { background: var(--sapx-color-bg-base); margin: 0; }
</style>
</head>
<body>
<section class="sapx-section">
  <div class="sapx-container">
    <div class="sapx-cta-banner" aria-labelledby="cta-heading">
      <h2 class="sapx-cta-banner-heading" id="cta-heading">See SENTINEL APEX correlate your feeds in real time</h2>
      <p class="sapx-cta-banner-copy">Connect your first feed in minutes with API-first onboarding, or book a live walkthrough with our solutions team.</p>
      <div class="sapx-cta-banner-actions">
        <a class="sapx-btn sapx-btn-primary" href="/get-api-key.html?plan=community&amp;utm_source=cta_banner&amp;utm_medium=cta&amp;utm_campaign=component_reference">Get Started Free</a>
        <a class="sapx-btn sapx-btn-secondary" href="/demo.html?utm_source=cta_banner&amp;utm_medium=cta&amp;utm_campaign=component_reference">Book a Live Demo</a>
      </div>
    </div>
  </div>
</section>
</body>
</html>
