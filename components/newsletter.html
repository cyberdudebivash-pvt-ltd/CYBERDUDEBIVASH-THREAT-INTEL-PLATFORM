<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component Reference: Newsletter CTA — SENTINEL APEX</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<!--
  SENTINEL APEX — Component Reference: Newsletter CTA (PR-4)
  ==================================================================
  Standalone, previewable reference markup for .sapx-newsletter-form
  / .sapx-newsletter-input inside a .sapx-cta-banner, used for
  newsletter/subscriber acquisition blocks.

  This is markup + styling ONLY — no submission handler is wired up.
  The form's `action`/`method` (or a client-side handler) must be
  supplied by whichever page/backend actually processes the signup;
  wiring that up is explicitly out of scope for this component-system
  PR (no backend/API changes).

  This file is NOT included or imported by any page automatically —
  copy the fragment(s) below into a page and wire up submission.

  Requires, in this order:
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
-->
<style>
  body { background: var(--sapx-color-bg-base); margin: 0; }
</style>
</head>
<body>
<section class="sapx-section">
  <div class="sapx-container-narrow">
    <div class="sapx-cta-banner" aria-labelledby="newsletter-heading">
      <h2 class="sapx-cta-banner-heading" id="newsletter-heading">Threat Intelligence Briefing, Weekly</h2>
      <p class="sapx-cta-banner-copy">CVE roundups, MITRE ATT&amp;CK detection notes, and AI security research — no fluff, unsubscribe anytime.</p>
      <!-- Placeholder action -- replace with the real subscribe endpoint before use. -->
      <form class="sapx-newsletter-form" action="#" method="post">
        <label for="newsletter-email" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Email address</label>
        <input class="sapx-newsletter-input" type="email" id="newsletter-email" name="email" placeholder="you@company.com" required autocomplete="email">
        <button type="submit" class="sapx-btn sapx-btn-primary">Subscribe</button>
      </form>
    </div>
  </div>
</section>
</body>
</html>
