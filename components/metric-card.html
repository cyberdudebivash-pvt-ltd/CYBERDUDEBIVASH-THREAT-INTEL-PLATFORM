<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component Reference: Metric Card / Statistics Grid — SENTINEL APEX</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<!--
  SENTINEL APEX — Component Reference: Metric Card / Statistics Grid (PR-4)
  ==================================================================
  Standalone, previewable reference markup for .sapx-metric-card from
  css/components.css, laid out in a .sapx-grid-4 statistics strip.

  Figures below reuse only stable SLA/format facts already asserted
  elsewhere in this repo (css/hero.css's stats strip, trust-center.html,
  mssp.html) — deliberately NOT live/baked-in counts (e.g. a point-in-
  time "74 feeds" figure), which is exactly the class of stale value
  PR-1 removed from crawler metadata. Replace with real figures per
  page, but keep to stable SLA/format claims rather than live counts
  that will go stale.

  This file is NOT included or imported by any page automatically —
  copy the fragment(s) below into a page as needed.

  Requires, in this order:
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
-->
<style>
  body { background: var(--sapx-color-bg-base); margin: 0; }
</style>
</head>
<body>
<section class="sapx-section" aria-labelledby="metrics-heading">
  <div class="sapx-container">
    <p class="sapx-section-kicker">Component Reference</p>
    <h2 class="sapx-section-heading" id="metrics-heading">Statistics Grid</h2>
    <p class="sapx-section-desc">.sapx-grid-4 of .sapx-card.sapx-metric-card — collapses to 2 columns at 900px, 1 column at 560px.</p>

    <div class="sapx-grid sapx-grid-4">
      <div class="sapx-card sapx-metric-card">
        <div class="sapx-metric-value">&lt;2h</div>
        <div class="sapx-metric-label">Feed Freshness SLA</div>
      </div>
      <div class="sapx-card sapx-metric-card">
        <div class="sapx-metric-value">99.9%</div>
        <div class="sapx-metric-label">Enterprise Uptime SLA</div>
      </div>
      <div class="sapx-card sapx-metric-card">
        <div class="sapx-metric-value">STIX 2.1</div>
        <div class="sapx-metric-label">Native Export Format</div>
      </div>
      <div class="sapx-card sapx-metric-card">
        <div class="sapx-metric-value">ATT&amp;CK v15</div>
        <div class="sapx-metric-label">MITRE Technique Mapping</div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
