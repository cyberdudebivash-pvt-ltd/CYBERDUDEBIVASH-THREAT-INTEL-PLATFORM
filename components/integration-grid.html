<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component Reference: Integration Grid — SENTINEL APEX</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<!--
  SENTINEL APEX — Component Reference: Integration Grid (PR-4)
  ==================================================================
  Standalone, previewable reference markup for .sapx-integration-card
  from css/components.css, laid out in a .sapx-grid-6 partner/logo
  strip. The "mark" is a plain text/monogram box (.sapx-integration-
  card-mark) rather than an image logo — this session's GitHub file
  tools store `content` as literal text and cannot reliably transfer
  binary image files (confirmed during PR-1's banner-image attempt),
  so real vendor logo assets are out of scope here. Swap in real SVG/
  PNG logo assets when available; the text-mark is a safe placeholder
  that keeps the grid usable today without fabricating a logo.

  Integration names reuse the same six systems already listed in
  css/hero.css's "Works With Your Stack" list (Splunk, Microsoft
  Sentinel, IBM QRadar, Elastic SIEM, MISP, TAXII 2.1) rather than
  inventing a new claim of vendor support.

  This file is NOT included or imported by any page automatically —
  copy the fragment(s) below into a page as needed.

  Requires, in this order:
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
-->
<style>
  body { background: var(--sapx-color-bg-base); margin: 0; }
</style>
</head>
<body>
<section class="sapx-section" aria-labelledby="integrations-heading">
  <div class="sapx-container-wide">
    <p class="sapx-section-kicker">Component Reference</p>
    <h2 class="sapx-section-heading" id="integrations-heading">Works With Your Stack</h2>
    <p class="sapx-section-desc">.sapx-grid-6 of .sapx-card.sapx-integration-card — collapses to 2 columns at 900px, 1 column at 560px.</p>

    <div class="sapx-grid sapx-grid-6">
      <div class="sapx-card sapx-integration-card">
        <span class="sapx-integration-card-mark" aria-hidden="true">SP</span>
        <span class="sapx-integration-card-name">Splunk</span>
      </div>
      <div class="sapx-card sapx-integration-card">
        <span class="sapx-integration-card-mark" aria-hidden="true">MS</span>
        <span class="sapx-integration-card-name">Microsoft Sentinel</span>
      </div>
      <div class="sapx-card sapx-integration-card">
        <span class="sapx-integration-card-mark" aria-hidden="true">QR</span>
        <span class="sapx-integration-card-name">IBM QRadar</span>
      </div>
      <div class="sapx-card sapx-integration-card">
        <span class="sapx-integration-card-mark" aria-hidden="true">ES</span>
        <span class="sapx-integration-card-name">Elastic SIEM</span>
      </div>
      <div class="sapx-card sapx-integration-card">
        <span class="sapx-integration-card-mark" aria-hidden="true">MI</span>
        <span class="sapx-integration-card-name">MISP</span>
      </div>
      <div class="sapx-card sapx-integration-card">
        <span class="sapx-integration-card-mark" aria-hidden="true">TX</span>
        <span class="sapx-integration-card-name">TAXII 2.1</span>
      </div>
    </div>
  </div>
</section>
</body>
</html>
