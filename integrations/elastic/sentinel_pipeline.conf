# CYBERDUDEBIVASH(R) SENTINEL APEX -- Elastic/Logstash Threat Intelligence Pipeline
#
# Polls the REAL, live, Enterprise-gated GET /api/siem/splunk endpoint
# (workers/intel-gateway/src/enterprise-endpoints.js, handleSiemSplunk) --
# despite the "splunk" name, it is a generic newline-delimited-JSON (NDJSON)
# threat-intel feed with no Splunk-specific framing, which is exactly what
# Logstash's http_poller input + json_lines codec expects. Requires a
# Sentinel APEX ENTERPRISE (or MSSP) API key; PRO/FREE keys get a 403 from
# the API itself, which this pipeline logs to Logstash's own log (not a
# silent empty ingest -- see the api_key sanity check below).
#
# Install: `bin/logstash-plugin install logstash-input-http_poller` (bundled
# with most modern Logstash distributions already). Set the real API key via
# the SENTINEL_APEX_API_KEY environment variable, never hardcoded here:
#
#     export SENTINEL_APEX_API_KEY="cdb_ent_..."
#     bin/logstash -f sentinel_pipeline.conf
#
# Docs: https://intel.cyberdudebivash.com/api-docs.html#siem-splunk

input {
  http_poller {
    urls => {
      sentinel_apex_feed => {
        method => "get"
        url => "https://intel.cyberdudebivash.com/api/siem/splunk?limit=500"
        headers => {
          "X-API-Key" => "${SENTINEL_APEX_API_KEY}"
          "Accept" => "application/x-ndjson"
        }
      }
    }
    request_timeout => 30
    # NDJSON: json_lines codec parses one JSON object per line, matching
    # exactly what handleSiemSplunk() emits -- no custom parsing needed.
    codec => "json_lines"
    # Enterprise threat feeds refresh on a slower cadence than log data;
    # polling every 5 minutes stays well under any per-key rate limiting
    # while still catching same-day new items.
    schedule => { every => "5m" }
    tags => ["sentinel_apex", "threat_intel"]
  }
}

filter {
  # handleSiemSplunk()'s real event shape: {time, source, sourcetype,
  # index, event: {id, title, severity, risk_score, cvss_score,
  # epss_score, kev_present, cve_ids, ttps, ioc_count, iocs, source_feed,
  # actor, sigma_rule_id, stix_id, apex_enterprise_score, soc_priority,
  # patch_urgency, threat_velocity, ransomware_affinity}}.
  if "sentinel_apex" in [tags] {
    date {
      match => ["[time]", "UNIX"]
      target => "@timestamp"
    }

    mutate {
      rename => {
        "[event][id]" => "sentinel_id"
        "[event][title]" => "threat_title"
        "[event][severity]" => "threat_severity"
        "[event][risk_score]" => "risk_score"
        "[event][cvss_score]" => "cvss_score"
        "[event][epss_score]" => "epss_score"
        "[event][kev_present]" => "kev_present"
        "[event][cve_ids]" => "cve_ids"
        "[event][ttps]" => "mitre_ttps"
        "[event][iocs]" => "indicators"
        "[event][ioc_count]" => "ioc_count"
        "[event][source_feed]" => "source_feed"
        "[event][actor]" => "threat_actor"
        "[event][sigma_rule_id]" => "sigma_rule_id"
        "[event][stix_id]" => "stix_id"
        "[event][apex_enterprise_score]" => "apex_enterprise_score"
        "[event][soc_priority]" => "soc_priority"
        "[event][patch_urgency]" => "patch_urgency"
        "[event][threat_velocity]" => "threat_velocity_score"
        "[event][ransomware_affinity]" => "ransomware_affinity_score"
      }
      remove_field => ["event", "time", "sourcetype", "index", "@version", "tags"]
    }

    if [risk_score] { mutate { convert => { "risk_score" => "float" } } }
    if [cvss_score] { mutate { convert => { "cvss_score" => "float" } } }
    if [epss_score] { mutate { convert => { "epss_score" => "float" } } }
  }
}

output {
  if "sentinel_apex" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:https://localhost:9200}"]
      # API-key auth (recommended) via env var; user/password auth also
      # works via the standard `user`/`password` options if preferred --
      # neither is hardcoded here.
      api_key => "${ELASTICSEARCH_API_KEY}"
      ssl_verification_mode => "full"
      index => "sentinel-threat-intel-%{+YYYY.MM.dd}"
      # sentinel_id is the platform's own stable report id -- using it as
      # the document _id makes re-polling idempotent (an unchanged item
      # updates in place instead of duplicating on every 5-minute poll).
      document_id => "%{sentinel_id}"
    }
  }
}
