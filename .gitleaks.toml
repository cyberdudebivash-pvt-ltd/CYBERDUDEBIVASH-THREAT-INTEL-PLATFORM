# SENTINEL APEX — Gitleaks configuration
# Suppress known false positives and local tooling files

title = "SENTINEL APEX Gitleaks Config"

[allowlist]
  description = "Allowlist for known non-production files"
  paths = [
    '''.gh_tok''',
    '''_.*\.py''',
    '''_.*\.bat''',
    '''_.*\.ps1''',
    '''_.*\.txt''',
    '''__commit.*\.txt''',
    '''commit_.*\.ps1''',
    '''check_.*\.py''',
    '''poll_.*\.py''',
    '''monitor_.*\.py''',
    '''get_token\.py''',
    '''get_gh_token\.ps1''',
    '''watch_.*\.py''',
    '''audit_.*\.py''',
    '''dispatch_.*\.py''',
    '''quick_.*\.py''',
    '''final_check\.py''',
    '''oneshot\.py''',

    # SEC-2026-07-25: these two files carry real, already-leaked plaintext
    # customer keys committed before the gitleaks gate was made blocking
    # (see revenue-orchestrator.yml and platform-build-deploy.yml same-date
    # comments). Allowlisted ONLY so turning this gate blocking doesn't fail
    # every future build on a known, already-being-rotated issue -- this is
    # not a statement that the content is safe. Remove this entry the moment
    # data/sovereign/tenants.json is stripped of real data (tracked as a
    # fast-follow) and data/marketplace/marketplace_state.json is rotated.
    '''data/sovereign/tenants\.json''',
    '''data/marketplace/marketplace_state\.json''',
  ]

  # Suppress generic token patterns in CI helper scripts
  regexes = [
    '''gho_[A-Za-z0-9]{36}''',
  ]
