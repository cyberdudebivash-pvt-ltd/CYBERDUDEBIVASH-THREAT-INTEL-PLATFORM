# SENTINEL APEX — Gitleaks configuration
# Suppress known false positives and local tooling files

title = "SENTINEL APEX Gitleaks Config"

[allowlist]
  description = "Allowlist for known non-production files"
  paths = [
    '''.gh_tok''',
    '''_.*\.py''',
    '''_.*\.bat''',
    '''_.*\.ps1''',
    '''_.*\.txt''',
    '''__commit.*\.txt''',
    '''commit_.*\.ps1''',
    '''check_.*\.py''',
    '''poll_.*\.py''',
    '''monitor_.*\.py''',
    '''get_token\.py''',
    '''get_gh_token\.ps1''',
    '''watch_.*\.py''',
    '''audit_.*\.py''',
    '''dispatch_.*\.py''',
    '''quick_.*\.py''',
    '''final_check\.py''',
    '''oneshot\.py''',

    # SEC-2026-08-23: data/sovereign/tenants.json previously carried real,
    # already-leaked plaintext customer keys (see revenue-orchestrator.yml
    # same-date comment for the incident writeup) and was allowlisted here
    # as a stopgap. It has now been stripped -- every api_key value replaced
    # with a non-functional cdb_REDACTED_ROTATE_REQUIRED_<tenant_id>
    # placeholder -- so this file is removed from the allowlist; real
    # key material committed here again should fail the gate.
    #
    # data/marketplace/marketplace_state.json is allowlisted for an
    # unrelated, ordinary reason: it's CI/test-run state with API-key-shaped
    # fixture values (tenant_ids like "test-tenant-001", "tier-ent-matrix")
    # that trip the same pattern without being real credentials.
    '''data/marketplace/marketplace_state\.json''',
  ]

  # Suppress generic token patterns in CI helper scripts
  regexes = [
    '''gho_[A-Za-z0-9]{36}''',
  ]
